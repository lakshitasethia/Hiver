name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPPORT_AGENT_EMBEDDER: hashing   # zero model download, deterministic
      SUPPORT_AGENT_LLM: fake           # no API key, deterministic
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: lint
        run: ruff check src eval tests
      - name: build sample + train + labelset
        run: |
          python -m support_agent.data.synthetic
          python -m support_agent.train
          python -m eval.make_labelset --target 200
      - name: tests
        run: pytest -q
      - name: eval harness runs end-to-end (offline; does not touch docs/report.md)
        run: python -m eval.report --no-report

      - name: AmazonHelp headline reproduces from the committed data + model
        env:
          SUPPORT_AGENT_EMBEDDER: st       # match models/clf.real.joblib (MiniLM)
        run: make eval-amazon
